name: Agente QA Gerador de Testes

on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  gerar-testes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Executar Agente QA com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/github-script@v7
        with:
          script: |
            const ownerRepo = process.env.REPOSITORY.split('/');
            
            // Busca os arquivos modificados no Pull Request atual dinamicamente
            const filesResponse = await github.rest.pulls.listFiles({
              owner: ownerRepo[0],
              repo: ownerRepo[1],
              pull_number: parseInt(process.env.PR_NUMBER)
            });

            // Filtra o primeiro arquivo .java alterado no PR
            const javaFile = filesResponse.data.find(f => f.filename.endsWith('.java'));
            
            if (!javaFile) {
              console.log("Nenhum arquivo Java encontrado nas alterações deste PR.");
              return;
            }

            console.log(`Lendo o conteúdo do arquivo alterado: ${javaFile.filename}`);
            
            // Faz o download do conteúdo bruto do arquivo modificado
            const fileContentResponse = await fetch(javaFile.raw_url);
            const codigoFonte = await fileContentResponse.text();

            const prompt = `Aja como um Engenheiro de QA Sênior e especialista em testes automatizados com JUnit 5 e Mockito. 
            Analise a classe Java abaixo (${javaFile.filename}) e escreva uma classe de teste unitário completa, cobrindo cenários de sucesso, falha e casos limites (edge cases):\n\n${codigoFonte}`;

            console.log("Enviando código para o Agente QA gerar os testes...");

            const maxRetries = 3;
            let attempt = 0;
            let success = false;
            let data;

            while (attempt < maxRetries && !success) {
              attempt++;
              try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${process.env.GEMINI_MODEL}:generateContent?key=${process.env.GEMINI_API_KEY}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                  })
                });

                data = await response.json();
                
                if (response.ok) {
                  success = true;
                } else if (response.status === 503 && attempt < maxRetries) {
                  console.log(`Tentativa ${attempt} falhou por alta demanda (503). Aguardando antes de tentar novamente...`);
                  await new Promise(resolve => setTimeout(resolve, 4000 * attempt));
                } else {
                  throw new Error(`Erro na API do Gemini: ${JSON.stringify(data)}`);
                }
              } catch (err) {
                if (attempt >= maxRetries) throw err;
                console.log(`Tentativa ${attempt} falhou: ${err.message}. Retentando...`);
                await new Promise(resolve => setTimeout(resolve, 4000 * attempt));
              }
            }

            const parecerIA = data.candidates?.[0]?.content?.parts?.[0]?.text || "Nenhum teste gerado.";
            console.log("Testes unitários gerados com sucesso pelo Agente QA.");

            await github.rest.issues.createComment({
              owner: ownerRepo[0],
              repo: ownerRepo[1],
              issue_number: parseInt(process.env.PR_NUMBER),
              body: `### 🧪 Relatório do Agente QA (Gerador de Testes)\n\nAbaixo estão os testes unitários sugeridos em JUnit 5 para o arquivo \`${javaFile.filename}\`:\n\n${parecerIA}`
            });
