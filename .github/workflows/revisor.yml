name: Agente Revisor Gemini

on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  analisar-codigo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Tentar compilar o código Java (Validação de Erros)
        run: |
          echo "Procurando arquivos Java no repositório..."
          find . -name "*.java"
          echo "Tentando compilar a Calculadora..."
          javac Calculadora.java
          echo "Compilação concluída com sucesso!"
