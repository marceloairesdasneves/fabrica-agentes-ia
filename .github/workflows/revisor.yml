name: Agente Revisor Gemini

on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  analisar-codigo:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Executar Agente Revisor com Gemini Pro
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let codigoFonte = "";
            try {
              codigoFonte = fs.readFileSync('Calculadora.java', 'utf8');
            } catch (e) {
              codigoFonte = "Arquivo Calculadora.java não encontrado na raiz.";
            }

            const prompt = `Aja como um Arquiteto de Software e Revisor Sênior implacável. Analise o código Java abaixo, aponte melhorias de Clean Code, boas práticas, tratamento de erros ou bugs de sintaxe:\n\n${codigoFonte}`;

            console.log("Enviando código para a API do Gemini...");
            const ownerRepo = process.env.REPOSITORY.split('/');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function gerarParecerIAComRetry(maxTentativas = 3) {
              for (let tentativa = 1; tentativa <= maxTentativas; tentativa++) {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${process.env.GEMINI_MODEL}:generateContent?key=${process.env.GEMINI_API_KEY}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                  })
                });

                const data = await response.json();

                if (response.ok) {
                  return data;
                }

                const geminiIndisponivel = response.status === 503 || data?.error?.status === "UNAVAILABLE";
                if (geminiIndisponivel && tentativa < maxTentativas) {
                  const esperaMs = tentativa * 2000;
                  console.warn(`Gemini indisponível (tentativa ${tentativa}/${maxTentativas}). Tentando novamente em ${esperaMs}ms...`);
                  await sleep(esperaMs);
                  continue;
                }

                const erro = new Error(`Erro na API do Gemini: ${JSON.stringify(data)}`);
                erro.name = geminiIndisponivel ? "GeminiTemporariamenteIndisponivel" : "ErroGemini";
                throw erro;
              }
            }

            try {
              const data = await gerarParecerIAComRetry();

              const parecerIA = data.candidates?.[0]?.content?.parts?.[0]?.text || "Análise concluída sem retorno de texto.";
              console.log("Parecer gerado com sucesso pela IA.");

              await github.rest.issues.createComment({
                owner: ownerRepo[0],
                repo: ownerRepo[1],
                issue_number: parseInt(process.env.PR_NUMBER, 10),
                body: `### 🤖 Relatório do Agente Revisor (Gemini)\n\n${parecerIA}`
              });

            } catch (error) {
              if (error.name === "GeminiTemporariamenteIndisponivel") {
                console.warn("Gemini indisponível após múltiplas tentativas. Comentário de aviso será publicado sem falhar o workflow.");
                await github.rest.issues.createComment({
                  owner: ownerRepo[0],
                  repo: ownerRepo[1],
                  issue_number: parseInt(process.env.PR_NUMBER, 10),
                  body: "### ⚠️ Agente Revisor (Gemini)\n\nO Gemini está temporariamente indisponível (erro 503/UNAVAILABLE) após múltiplas tentativas. O workflow foi concluído sem bloquear o PR. Tente executar o workflow novamente em alguns minutos."
                });
                return;
              }

              console.error("Erro detalhado ao chamar a API do Gemini:", error);
              throw error;
            }
